# ✏️ EDITABLE — Research themes (rendered as cards on home + filters on /papers/).
#
# TEMPLATE (copy, fill in):
#
# - id: theme-slug                         # REQUIRED, unique slug — also used in papers.yaml `themes:` list
#   name: "Theme Name"                     # REQUIRED
#   icon: cursor                           # optional — shield | cursor | compass | scale
#                                          #   (to add a new icon, edit src/components/ThemeCard.astro)
#   order: 2                               # lower = earlier
#   blurb: "1–2 sentence description."     # REQUIRED
#
# Don't rename `id` without also updating papers.yaml `themes:` arrays.
# ============================================================

- id: agents
  name: "Agents & Computer Use"
  icon: cursor
  order: 2
  blurb: "Agents that act on real computers — clicking, coding, and negotiating. We study how to ground language in environments, how to reward the right behaviors, and how to make these systems verifiable and steerable."

- id: alignment
  name: "Alignment & RL"
  icon: compass
  order: 3
  blurb: "Post-training that holds up under pressure. We work on reinforcement finetuning, in-situ user feedback, curriculum design, and the hidden costs of optimization — like the hallucination tax that comes with sharper reward signals."

- id: evaluation
  name: "Evaluation & Personalization"
  icon: scale
  order: 4
  blurb: "How do we measure what models actually know — and for whom? We probe knowledge deficiencies on massive KBs, study LLM-as-a-judge uncertainty, and design evaluations that account for cultural and personal variation."

- id: trustworthiness
  name: "Trustworthiness & Safety"
  icon: shield
  order: 1
  blurb: "Auditing what large models say, store, and reveal — from social bias and stereotyping to hallucination, location leakage, and unsafe training data. We build evaluations that surface failures real users will hit, not just average-case scores."
