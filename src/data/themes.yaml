# ============================================================
# ✏️ EDITABLE — Research themes (rendered as cards on home + filters on /papers/).
#
# Special entry: id `_intro` with an `intro:` field renders as the paragraph
# above the theme card grid on the home page (not rendered as a card itself).
#
# TEMPLATE for a regular theme entry:
#
# - id: theme-slug                         # REQUIRED, unique slug — also used in papers.yaml `themes:` list
#   name: "Theme Name"                     # REQUIRED
#   icon: cursor                           # optional — shield | cursor | compass | scale
#                                          #   (to add a new icon, edit src/components/ThemeCard.astro)
#   order: 2                               # lower = earlier
#   blurb: "1–2 sentence description."     # REQUIRED
#
# Don't rename `id` without also updating papers.yaml `themes:` arrays.
# ============================================================

- id: _intro
  order: 0
  intro: "We study AI systems beyond static benchmarks: how they adapt, act, fail, and become trustworthy in real-world settings."


- id: alignment
  name: "Learning & Alignment"
  icon: compass
  order: 1
  blurb: "We study how models adapt through post-training, reinforcement finetuning, user feedback, personalization, and curriculum design."

- id: agents
  name: "Agents & Computer Use"
  icon: cursor
  order: 2
  blurb: "We build and evaluate agents that use computers, tools, and domain knowledge to plan, act, recover, and collaborate."

- id: evaluation
  name: "Evaluation & Measurement"
  icon: scale
  order: 3
  blurb: "We design evaluations that reveal what models actually know, understand, and fail to do across reasoning, multimodal, cultural, and agentic tasks."

- id: trustworthiness
  name: "Trustworthiness & Safety"
  icon: shield
  order: 4
  blurb: "We audit failures that matter in real use: bias, hallucination, privacy leakage, unsafe data influence, and brittle model judgments."