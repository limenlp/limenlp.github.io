#   period: "2026.8 – Now"                   # optional
#   research: "LLM agents · evaluation"      # optional, current research focus
#   work: "Built [WildFeedback](https://...); eval pipeline."   # optional, what they've contributed; markdown [text](url) supported
#   photo: /images/members/new-student.jpg   # optional — falls back to initial letters in a green circle
#   url: "https://newstudent.github.io"      # optional homepage
#   note: "Co-advised with X"                # optional italic note
#   order: 14                                # lower = earlier in role section
#   coAdvisor:                               # optional
#     name: "Emilio Ferrara"
#     url: "https://..."
#   social:                                  # optional, any subset
#     scholar: "https://scholar.google.com/..."
#     twitter: "https://twitter.com/..."
#     github: "https://github.com/..."
#     linkedin: "https://linkedin.com/in/..."
#     email: "name@usc.edu"
#     orcid: "https://orcid.org/..."
#
# Grad student leaves: MOVE entry to alumni.yaml (don't delete).
#
# INTERN / VISITOR convention (READ THIS BEFORE ADDING AN INTERN):
# - Use `role: visiting` for EVERY intern / visitor (summer, semester, collaborator).
#   The phd/master/undergrad roles are reserved for USC students Jieyu primarily advises.
# - `period`: use "Summer 2025" / "Spring 2026" for short term; "2025.9 – 2026.5" for longer.
# - `note`: write affiliation — "Visiting from Tsinghua", "Microsoft Research intern", etc.
#   This is what distinguishes a visitor from a regular member.
# - `order`: give visiting members order ≥ 20 so they sort below regular grad students.
# - When intern leaves → move to alumni.yaml with `track: visiting`.
# ============================================================

